<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arda Boutique | Yeni Sezon Koleksiyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --dark: #111111;
            --accent: #ff4757;
            --gray: #f4f4f4;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--dark);
        }

        /* Navigasyon */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: white;
            z-index: 1000;
        }

        .logo { font-family: 'Oswald', sans-serif; font-size: 24px; letter-spacing: 2px; }

        /* Ürün Grid Sistemi */
        .container { padding: 40px 5%; }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--bg);
            transition: 0.4s;
            position: relative;
        }

        .product-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            transition: 0.5s;
        }

        .product-card:hover img { transform: scale(1.05); }

        .product-info { padding: 15px 0; }
        .product-title { font-weight: 700; margin: 5px 0; }
        .product-price { color: #666; font-size: 0.9rem; }

        /* Satın Al / Sepete Ekle Butonu */
        .add-btn {
            background: var(--dark);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 10px;
            font-weight: 700;
            transition: 0.3s;
        }

        .add-btn:hover { background: var(--accent); }

        footer { background: var(--gray); padding: 40px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ARDA BOUTIQUE</div>
        <div>Sepet (0)</div>
    </nav>

    <div class="container">
        <h2 style="text-align:center; font-family:'Oswald'; margin-bottom:40px;">YENİ SEZON KOLEKSİYONU</h2>
        <div class="product-grid">
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1000" alt="Moda 1">
                <div class="product-info">
                    <div class="product-title">Oversize Basic Tshirt</div>
                    <div class="product-price">499.00 TL</div>
                    <a href="https://wa.me/905000000000?text=Oversize%20Basic%20Tshirt%20siparişi%20vermek%20istiyorum." class="add-btn">WHATSAPP İLE SATIN AL</a>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1539109132314-34a9c6954200?q=80&w=1000" alt="Moda 2">
                <div class="product-info">
                    <div class="product-title">Vintage Denim Ceket</div>
                    <div class="product-price">1,250.00 TL</div>
                    <a href="https://wa.me/905000000000?text=Vintage%20Denim%20Ceket%20siparişi%20vermek%20istiyorum." class="add-btn">WHATSAPP İLE SATIN AL</a>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1000" alt="Moda 3">
                <div class="product-info">
                    <div class="product-title">Floral Yaz Elbisesi</div>
                    <div class="product-price">850.00 TL</div>
                    <a href="https://wa.me/905000000000?text=Floral%20Yaz%20Elbisesi%20siparişi%20vermek%20istiyorum." class="add-btn">WHATSAPP İLE SATIN AL</a>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 Arda Boutique | Tasarım Arda</p>
    </footer>

</body>
</html>
