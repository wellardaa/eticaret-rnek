<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arda Boutique | Premium Koleksiyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --dark: #111111; --accent: #ff4757; --gray: #f4f4f4; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background-color: var(--bg); color: var(--dark); }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; z-index: 1000; }
        .logo { font-family: 'Oswald', sans-serif; font-size: 24px; letter-spacing: 2px; }

        .container { padding: 40px 5%; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }

        .product-card { background: var(--bg); cursor: pointer; transition: 0.3s; }
        .product-card img { width: 100%; height: 380px; object-fit: cover; }
        .product-card:hover { transform: translateY(-5px); }

        .product-info { padding: 15px 0; text-align: center; }
        .product-title { font-weight: 700; margin: 5px 0; }
        .product-price { color: var(--accent); font-weight: bold; }

        /* MODAL (Açıklama Penceresi) */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; }
        .modal-content { background: white; margin: 5% auto; padding: 30px; width: 80%; max-width: 900px; border-radius: 10px; display: flex; gap: 30px; flex-wrap: wrap; }
        .modal-images { flex: 1; min-width: 300px; }
        .modal-details { flex: 1; min-width: 300px; }
        .main-modal-img { width: 100%; height: 400px; object-fit: cover; border-radius: 5px; }
        .thumb-container { display: flex; gap: 10px; margin-top: 10px; }
        .thumb { width: 80px; height: 80px; object-fit: cover; cursor: pointer; border: 2px solid transparent; }
        .thumb:hover { border-color: var(--accent); }
        .close { float: right; font-size: 30px; cursor: pointer; color: #333; }
        
        .buy-btn { background: var(--dark); color: white; padding: 15px; width: 100%; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; }

        @media (max-width: 768px) { .modal-content { width: 95%; margin: 2% auto; flex-direction: column; } }
    </style>
</head>
<body>

<nav>
    <div class="logo">ARDA BOUTIQUE</div>
    <div>Menü ☰</div>
</nav>

<div class="container">
    <h2 style="text-align:center; font-family:'Oswald'; margin-bottom:40px;">TREND KOLEKSİYON</h2>
    <div class="product-grid" id="productGrid">
        <!-- Ürünler JS ile buraya gelecek -->
    </div>
</div>

<!-- Modal Yapısı -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-images">
            <img id="mainImg" src="" class="main-modal-img">
            <div id="thumbContainer" class="thumb-container"></div>
        </div>
        <div class="modal-details">
            <h2 id="modalTitle"></h2>
            <p id="modalDesc" style="color:#666; line-height:1.6;"></p>
            <h3 id="modalPrice" style="color:var(--accent);"></h3>
            <button class="buy-btn" onclick="orderWA()">WHATSAPP İLE SİPARİŞ VER</button>
        </div>
    </div>
</div>

<script>
    const products = [
        {
            id: 1, title: "Oversize Deri Ceket", price: "2.450 TL", 
            desc: "Hakiki deri görünümlü, içi kürklü kışlık ceket. Üç farklı açıdan inceleyin.",
            images: [
                "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=800", // Ön
                "https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504?w=800", // Yan
                "https://images.unsplash.com/photo-1551028150-64b9f398f678?w=800"  // Detay
            ]
        },
        {
            id: 2, title: "Retro Kargo Pantolon", price: "850 TL", 
            desc: "Bol kesim, 6 cepli dayanıklı kumaş. Sokak stili için ideal.",
            images: [
                "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=800",
                "https://images.unsplash.com/photo-1624371414361-e6e0ed2b6512?w=800",
                "https://images.unsplash.com/photo-1517441667397-09903901869e?w=800"
            ]
        }
    ];

    const grid = document.getElementById('productGrid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="product-card" onclick="openModal(${p.id})">
                <img src="${p.images[0]}">
                <div class="product-info">
                    <div class="product-title">${p.title}</div>
                    <div class="product-price">${p.price}</div>
                </div>
            </div>
        `;
    });

    function openModal(id) {
        const p = products.find(x => x.id === id);
        document.getElementById('modalTitle').innerText = p.title;
        document.getElementById('modalDesc').innerText = p.desc;
        document.getElementById('modalPrice').innerText = p.price;
        document.getElementById('mainImg').src = p.images[0];
        
        const thumbs = document.getElementById('thumbContainer');
        thumbs.innerHTML = '';
        p.images.forEach(img => {
            thumbs.innerHTML += `<img src="${img}" class="thumb" onclick="document.getElementById('mainImg').src='${img}'">`;
        });
        
        document.getElementById('productModal').style.display = "block";
    }

    function closeModal() { document.getElementById('productModal').style.display = "none"; }
    function orderWA() {
        const title = document.getElementById('modalTitle').innerText;
        window.open(`https://wa.me/905000000000?text=${encodeURIComponent(title)} ürünü hakkında bilgi almak istiyorum.`);
    }
</script>

</body>
</html>
